<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EcoDrive - Reset Password</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="nav.js" defer></script>
    <script src="forgot-password.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">EcoDrive</a>
        <ul class="nav-links">
            <li><a href="login.html" class="active">Login</a></li>
        </ul>
    </nav>

    <div class="main-container">
        <h1>Reset Password</h1>
        <p style="margin-bottom: 20px; color: #666;">Enter your email to receive recovery instructions.</p>

        <form id="forgotForm">
            <div class="form-group">
                <label for="resetEmail">Email:</label>
                <input type="email" id="resetEmail" required>
            </div>
            <button type="submit" class="btn-gray btn-block">Send Reset Link</button>
            <a href="login.html" class="btn-gray btn-block">Back to Login</a>
        </form>
        <p id="forgotMessage" class="alert"></p>
    </div>
</body>
</html>
