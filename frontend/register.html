<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EcoDrive - Register</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="register.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">EcoDrive</a>
        <ul class="nav-links">
            <li><a href="index.html">Vehicles</a></li>
            <li><a href="account.html">My Account</a></li>
            <li><a href="login.html" class="active">Login</a></li>
        </ul>
    </nav>

    <div class="main-container">
        <h1>Create an Account</h1>

        <form id="registerForm">
            <div class="form-group">
                <label for="fname">First Name:</label>
                <input type="text" id="fname" name="fname" required>
            </div>
            
            <div class="form-group">
                <label for="lname">Last Name:</label>
                <input type="text" id="lname" name="lname" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" minlength="6" required>
            </div>

            <button type="submit" class="btn-gray btn-block">Register</button>
            <a href="login.html" class="btn-gray btn-block">Already have an account? Login</a>
        </form>
        <p id="registerMessage" class="alert"></p>
    </div>
</body>
</html>
